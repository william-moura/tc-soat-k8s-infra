apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-app-laravel
  labels:
    app: tc-app-laravel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc-app-laravel
  template:
    metadata:
      labels:
        app: tc-app-laravel
    spec:
      containers:
      - name: laravel
        image: ghcr.io/william-moura/tech-challenge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          value: "tc-mysql-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "techchallenge"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "secretpassword"
---
apiVersion: v1
kind: Service
metadata:
  name: tc-app-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80    
  selector:
    app: tc-app-laravel
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-os
  namespace: saga-oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-os
  template:
    metadata:
      labels:
        app: postgres-os
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OS_DB_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-os
  namespace: saga-oficina
spec:
  selector:
    app: postgres-os
  ports:
    - port: 5432
      targetPort: 5432

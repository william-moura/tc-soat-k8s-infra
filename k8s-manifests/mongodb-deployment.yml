apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-billing
  namespace: saga-oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-billing
  template:
    metadata:
      labels:
        app: mongodb-billing
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-billing
  namespace: saga-oficina
spec:
  selector:
    app: mongodb-billing
  ports:
    - port: 27017
      targetPort: 27017
---

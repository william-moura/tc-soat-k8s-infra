apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-api
  namespace: saga-oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-api
  template:
    metadata:
      labels:
        app: production-api
    spec:
      containers:
        - name: production-api
          image: tc-production-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000 # Ajuste para 80 se o Dockerfile usar Nginx/Apache
          env:
            - name: DD_SERVICE
              value: "tc-production-service"
            - name: DD_ENV
              valueFrom: { configMapKeyRef: { name: app-config, key: APP_ENV } }
            - name: APP_ENV
              valueFrom: { configMapKeyRef: { name: app-config, key: APP_ENV } }
            - name: APP_DEBUG
              valueFrom: { configMapKeyRef: { name: app-config, key: APP_DEBUG } }
            - name: LOG_CHANNEL
              valueFrom: { configMapKeyRef: { name: app-config, key: LOG_CHANNEL } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: PRODUCTION_APP_KEY } }
            - name: DB_CONNECTION
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCTION_DB_CONNECTION } }
            - name: MONGODB_URI
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCTION_MONGODB_URI } }
            - name: MONGODB_DATABASE
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCTION_MONGODB_DATABASE } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_PORT } }
            - name: RABBITMQ_VHOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_VHOST } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD } }
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: production-api
  namespace: saga-oficina
spec:
  selector:
    app: production-api
  ports:
    - port: 80
      targetPort: 8000 # Deve corresponder ao containerPort acima
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-worker
  namespace: saga-oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-worker
  template:
    metadata:
      labels:
        app: production-worker
    spec:
      containers:
        - name: production-worker
          image: tc-production-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "production:consume", "--queue=all"]
          env:
            - name: DD_SERVICE
              value: "tc-production-worker"
            - name: APP_ENV
              valueFrom: { configMapKeyRef: { name: app-config, key: APP_ENV } }
            - name: LOG_CHANNEL
              valueFrom: { configMapKeyRef: { name: app-config, key: LOG_CHANNEL } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: PRODUCTION_APP_KEY } }
            - name: DB_CONNECTION
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCTION_DB_CONNECTION } }
            - name: MONGODB_URI
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCTION_MONGODB_URI } }
            - name: MONGODB_DATABASE
              valueFrom: { configMapKeyRef: { name: app-config, key: PRODUCTION_MONGODB_DATABASE } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_PORT } }
            - name: RABBITMQ_VHOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_VHOST } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD } }
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: production-api-hpa
  namespace: saga-oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: production-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

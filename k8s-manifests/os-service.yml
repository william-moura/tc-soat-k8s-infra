apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-api-hpa
  namespace: saga-oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

name: Deploy Kubernetes Manifests to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to k3s VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: true
          script: |
            rm -rf ~/k8s-manifests && mkdir -p ~/k8s-manifests
            git clone --branch master https://github.com/william-moura/tc-soat-k8s-infra.git ~/k8s-manifests

            # Garante uso das imagens locais importadas no k3s
            sed -i 's/imagePullPolicy: Always/imagePullPolicy: IfNotPresent/g' ~/k8s-manifests/k8s-manifests/*.yml

            # 1. Garante que o namespace saga-oficina exista antes de aplicar os recursos
            sudo k3s kubectl create namespace saga-oficina --dry-run=client -o yaml | sudo k3s kubectl apply -f -

            # 2. Aplica todos os manifestos do diretório
            sudo k3s kubectl apply -f ~/k8s-manifests/k8s-manifests/

            rm -rf ~/k8s-manifests
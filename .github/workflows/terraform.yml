name: Terraform Deploy K8s Infra

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Deploy Manifests to K8s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo k3s kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s-manifests/configmap-secrets.yaml
            sudo k3s kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/main/k8s-manifests/app-deployment.yaml
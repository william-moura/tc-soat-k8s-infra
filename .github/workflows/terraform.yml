name: Deploy Kubernetes Manifests to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to k3s VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: true
          script: |
            rm -rf ~/k8s-manifests && mkdir -p ~/k8s-manifests
            git clone --branch master https://github.com/william-moura/tc-soat-k8s-infra.git ~/k8s-manifests

            # Garante que imagens locais sejam usadas se já estiverem importadas no k3s
            sed -i 's/imagePullPolicy: Always/imagePullPolicy: IfNotPresent/g' ~/k8s-manifests/k8s-manifests/*.yml

            # 1. Aplica o namespace primeiro
            sudo k3s kubectl apply -f ~/k8s-manifests/k8s-manifests/namespace.yml

            # 2. Aplica os demais manifestos (que já apontam para saga-oficina)
            sudo k3s kubectl apply -f ~/k8s-manifests/k8s-manifests/

            rm -rf ~/k8s-manifests
name: Build & Deploy Laravel to K3s

on:
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-k8s:
    name: Trigger Kubernetes Rollout
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Restart Deployment on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Reinicia os Pods do K3s para puxar a imagem :latest atualizada do GHCR
            sudo k3s kubectl rollout restart deployment/tc-app-laravel
            
            # Aguarda a conclusão da atualização dos pods
            sudo k3s kubectl rollout status deployment/tc-app-laravel --timeout=60s

            # Executa as migrations do Laravel no pod ativo
            POD_NAME=$(sudo k3s kubectl get pods -l app=tc-app-laravel -o jsonpath='{.items[0].metadata.name}')
            sudo k3s kubectl exec $POD_NAME -- php artisan migrate --force